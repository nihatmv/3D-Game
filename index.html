<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%APP_TITLE%</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="#fbe3c8" />

    <!-- Link previews (LinkedIn, Slack, X, email). og:image must be absolute: set VITE_SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%APP_TITLE%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:url" content="%APP_URL%" />
    <meta property="og:image" content="%APP_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%APP_TITLE%" />
    <meta name="twitter:description" content="%APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%APP_OG_IMAGE%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Not render-blocking: text shows in the fallback font until Nunito arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%9D%3C/text%3E%3C/svg%3E" />
    <style>
      /* Loading screen: shown before any JS runs, removed by src/boot.ts. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 24px;
        background: linear-gradient(180deg, #fbe3c8, #bfe6e2);
        color: #3d2f23;
        font-family: 'Nunito', ui-rounded, system-ui, sans-serif;
        text-align: center;
        transition: opacity 0.5s;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-name { font-size: clamp(28px, 6vw, 44px); font-weight: 700; line-height: 1.1; }
      .boot-role { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #2f8f98; }
      .boot-bar { position: relative; width: 140px; height: 4px; margin-top: 18px; overflow: hidden; border-radius: 4px; background: rgba(61, 47, 35, 0.12); }
      .boot-bar span { position: absolute; inset: 0; width: 40%; border-radius: 4px; background: #e9a55a; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar span { animation: none; } #boot { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="boot-name">%APP_NAME%</div>
      <div class="boot-role">%APP_ROLE%</div>
      <div class="boot-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
